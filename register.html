<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles.css">
    <title>Registro DCC</title>
</head>
<body">
    <h2 class="mb-5 text-center">Registro de Comunidad</h2>
    
    <form name="myForm" id="form-register" action="#" method="post" novalidate>

        <div class="mb-3">
            <label for="name" class="form-label">Nombre Completo</label>
            <input type="text" class="form-control" name="name" id="name" placeholder="complete con su nombre">
        </div>

        <div class="mb-3">
            <label for="email" class="form-label">Correo Electrónico</label>
            <input type="email" class="form-control" name="email" id="email" placeholder="correo@ejemplo.com">
        </div>

        <div class="mb-3">
            <label for="phone" class="form-label">Teléfono</label>
            <input type="tel" class="form-control" name="phone" id="phone" placeholder="569 12345678">
        </div>

         <div class="mb-3">
            <label for="telegram" class="form-label">Nombre de Telegram</label>
            <input type="text" class="form-control" name="telegram" id="telegram" placeholder="@usuarioX"><br>
        </div>

        <div class="checkbox" style="margin-top: 20px; margin-bottom: 20px;">
            <label>
                <input type="checkbox" name="terminos" id="terminos">
                 Confirmo ser parte del departamento de Ciencias de la Computación 
            </label>
        </div><br>
            <button id="submit-btn" type="button" class="btn btn-primary btn-lg">Continuar</button>
        </form>
</body>
</html>
