<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actividades</title>
</head>
<body>
    <h2>Registro de Actividades</h2>

    <form action="#" method="post">

        <div class="mb-3">
            <label for="select-department" class="form-label">Categoría</label>
            <select class="form-control" name="select-department" id="select-department">
                <option value="">Seleccione una categoría</option>
                <option value="funcionario">Funcionario</option>
                <option value="estudiante">Estudiante</option>
            </select><br>
        </div>

        <div class="form-group">
            <label>¿Qué tipo de actividades realizas?</label><br>
            <div class="checkbox">
                <label><input type="checkbox" name="actividades" value="artistica"> Artística</label>
            </div>
            <div class="checkbox">
                <label><input type="checkbox" name="actividades" value="deportiva"> Deportiva</label>
            </div>
            <div class="checkbox">
                <label><input type="checkbox" name="actividades" value="tecnologica"> Tecnológica</label>
            </div>
            <div class="checkbox">
                <label><input type="checkbox" name="actividades" value="sociales"> Sociales</label>
            </div>
            <div class="checkbox">
                <label><input type="checkbox" name="actividades" value="recreativa"> Recreativa</label>
            </div>
        </div>

        <div class="mb-3">
            <label for="activity" class="form-label">Actividad</label>
            <input type="text" class="form-control" name="activity" id="activity" placeholder="Descripción de la actividad">
        </div>
        <button type="submit">Registrar Actividad</button>
    </form>
</body>
</html>
