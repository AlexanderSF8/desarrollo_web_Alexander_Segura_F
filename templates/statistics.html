{% extends "base.html" %}

{% block title %}Métricas y Estadísticas DCC{% endblock %}

{% block content %}
<div class="container my-5">
    
    <h2 class="mb-4 text-center">Panel de Estadísticas (Dashboard)</h2>

    <div class="row mb-4">
        <div class="col-12">
            <div class="card shadow-sm">
                <div class="card-header bg-white pb-0 border-0 pt-3">
                    <h3 class="card-title fs-5">Evolución de Registros por Día</h3>
                </div>
                <div class="card-body">
                    <canvas id="membersChart" height="80"></canvas>
                </div>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-md-6 mb-4">
            <div class="card shadow-sm h-100">
                <div class="card-header bg-white pb-0 border-0 pt-3">
                    <h3 class="card-title fs-5">Actividades por Tipo</h3>
                </div>
                <div class="card-body d-flex justify-content-center">
                    <div style="position: relative; height:300px; width:100%">
                        <canvas id="activitiesTypeChart"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-md-6 mb-4">
            <div class="card shadow-sm h-100">
                <div class="card-header bg-white pb-0 border-0 pt-3">
                    <h3 class="card-title fs-5">Actividades por Comuna</h3>
                </div>
                <div class="card-body">
                    <canvas id="activitiesCommuneChart" height="200"></canvas>
                </div>
            </div>
        </div>
    </div>
    
    <div class="text-center mt-4 mb-5">
        <a href="{{ url_for('views.index') }}" class="btn btn-outline-secondary btn-lg px-5">
            <i class="bi bi-arrow-left me-2"></i> Volver al inicio
        </a>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="{{ url_for('static', filename='js/chart-statistics.js') }}"></script>

{% endblock %}
